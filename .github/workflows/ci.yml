name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: peterhouse
          POSTGRES_PASSWORD: peterhouse
          POSTGRES_DB: peterhouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peterhouse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Each backend test file creates (and drops) its own throwaway database through this connection.
      TEST_ADMIN_URL: postgres://peterhouse:peterhouse@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (shared, backend, frontend)
        run: pnpm typecheck
      - name: Backend tests (real Postgres)
        run: pnpm test
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend build
        run: pnpm --filter @peterhouse/frontend build
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high
        continue-on-error: true   # report, but do not block a merge on an advisory with no fix yet

  docker:
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      matrix:
        include:
          - name: backend
            file: app/backend/Dockerfile
          - name: frontend
            file: app/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          build-args: |
            BACKEND_URL=http://backend:4100
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
