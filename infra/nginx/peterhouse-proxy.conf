# Shared proxy settings. Install as /etc/nginx/peterhouse-proxy.conf (harden.sh does this).
# nginx is the only thing facing the internet, so X-Forwarded-For is OVERWRITTEN with the real peer, not appended:
# a client cannot forge an address to dodge the rate limits.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
proxy_request_buffering on;
