# nginx site for the Learning Review. Install as /etc/nginx/conf.d/peterhouse.conf (harden.sh does this and
# replaces reviews.example.com with your domain). Needs nginx 1.19.4+ (Ubuntu 24.04 ships 1.24).
#
#   browser ──TLS──▶ nginx ──▶ /api/*  → backend  127.0.0.1:4100
#                            └─▶ others → frontend 127.0.0.1:3000

server_tokens off;

# One shared budget per client address. Sign-in is far stricter: 5 attempts a minute (plus the backend's own lockout).
limit_req_zone $binary_remote_addr zone=ph_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ph_login:10m rate=5r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=ph_conn:10m;

# Pages and the API go to different upstreams; keepalive avoids a new TCP connection per request.
upstream ph_backend {
    server 127.0.0.1:4100;
    keepalive 16;
}
upstream ph_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── Anything that is not our domain (an IP address, a stray DNS name) gets nothing ───────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# ── HTTP: only the certificate check and a redirect ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name reviews.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────────────────────────
server {
    # "http2" on the listen line works on 1.24 (Ubuntu 24.04) and newer, which only warn that it is deprecated.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reviews.example.com;

    ssl_certificate     /etc/letsencrypt/live/reviews.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reviews.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # Photos are re-encoded to at most ~1 MB, but phones upload originals first: allow up to 25 MB (backend limit).
    client_max_body_size 26m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_req zone=ph_general burst=60 nodelay;
    limit_conn ph_conn 40;

    # Never serve dotfiles (.git, .env…), even though nothing here should exist.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Headers for pages. Next.js needs inline scripts and styles; fonts are self-hosted by next/font, so no third parties.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Sign-in: the strictest limit. Exact match, so it wins over the /api/ block below.
    location = /api/auth/login {
        limit_req zone=ph_login burst=5 nodelay;
        include /etc/nginx/peterhouse-proxy.conf;
        proxy_pass http://ph_backend;
    }

    # The API: private data, so nothing is cached. PDFs and AI writing can take a while (120s timeouts, set in peterhouse-proxy.conf).
    location /api/ {
        include /etc/nginx/peterhouse-proxy.conf;
        proxy_pass http://ph_backend;
        # The backend (helmet) sets these too; keep one copy of each.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # add_header in a location replaces the server-level ones, so repeat the ones that matter.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        include /etc/nginx/peterhouse-proxy.conf;
        proxy_pass http://ph_frontend;
    }
}
